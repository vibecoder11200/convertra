# Self-hosted Umami analytics for Convertra — sized for a low-RAM VPS
# (~300MB total: app + bundled Postgres). See docs/ANALYTICS.md for the full
# deploy guide. Secrets live in a sibling git-ignored `.env` (see .env.example).
#
# The image tag is PINNED: check https://github.com/umami-software/umami/releases
# before upgrading (docs/ANALYTICS.md documents the upgrade procedure).
# Convertra requires Umami >= v3.2.0.
services:
    umami:
        image: ghcr.io/umami-software/umami:v3.4.0
        ports:
            - "127.0.0.1:3001:3000" # loopback only; the reverse proxy terminates TLS
        environment:
            DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD:?set in .env}@db:5432/umami
            APP_SECRET: ${APP_SECRET:?set in .env}
            # only needed if enabling 2FA: openssl rand -hex 32
            TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
            # disable Umami's own telemetry collection
            DISABLE_TELEMETRY: 1
        depends_on:
            db:
                condition: service_healthy
        init: true
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl http://localhost:3000/api/heartbeat",
                ]
            interval: 30s
            timeout: 5s
            retries: 5

    db:
        image: postgres:15-alpine
        environment:
            POSTGRES_DB: umami
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
        volumes:
            - umami-db-data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    umami-db-data:
