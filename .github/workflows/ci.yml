name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    # Needed by $env/static/public type resolution during `bun run check` and
    # by the production build. Values match .env.example defaults.
    PUB_HOSTNAME: localhost:5173
    PUB_ENV: production
    PUB_DISABLE_ALL_EXTERNAL_REQUESTS: "true"
    PUB_DISABLE_FAILURE_BLOCKS: "true"
    # Optional/public-exposed vars; empty values are valid for type resolution.
    PUB_PLAUSIBLE_URL: ""
    PUB_VERTD_URL: ""
    PUB_DONATION_URL: ""
    PUB_DONATION_API: ""
    PUB_STRIPE_KEY: ""

jobs:
    lint-typecheck-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Cache Bun store
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      bun-${{ runner.os }}-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate paraglide messages
              run: bunx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bun run check

            - name: Build
              run: bun run build
