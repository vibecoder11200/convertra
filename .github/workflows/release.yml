name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write
    packages: write

jobs:
    build-and-publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

            - name: Build and push with SBOM + provenance
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: true
                  sbom: true
                  build-args: |
                      PUB_ENV=production
                      PUB_HOSTNAME=${{ vars.PUB_HOSTNAME || '' }}
                      PUB_PLAUSIBLE_URL=${{ vars.PUB_PLAUSIBLE_URL || '' }}
                      PUB_UMAMI_URL=${{ vars.PUB_UMAMI_URL || '' }}
                      PUB_UMAMI_WEBSITE_ID=${{ vars.PUB_UMAMI_WEBSITE_ID || '' }}
                      PUB_VERTD_URL=${{ vars.PUB_VERTD_URL || '' }}
                      PUB_DISABLE_ALL_EXTERNAL_REQUESTS=false
                      PUB_DONATION_URL=${{ vars.PUB_DONATION_URL || '' }}
                      PUB_STRIPE_KEY=${{ secrets.PUB_STRIPE_KEY || '' }}

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
