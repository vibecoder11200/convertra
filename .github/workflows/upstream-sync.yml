name: Sync Upstream

# On-demand sync of upstream VERT main. The fork tracks upstream selectively
# (specific features/fixes), so this is a manual dispatch, not a nightly cron —
# run it when you want to pull recent upstream changes into `main`.
on:
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Fetch upstream
              run: |
                  git remote add upstream https://github.com/VERT-sh/VERT.git
                  git fetch upstream main

            - name: Create sync branch
              run: |
                  git checkout -b chore/upstream-sync origin/main || git checkout -b chore/upstream-sync main
                  git merge upstream/main --no-edit || true

            - name: Open sync PR if diverged
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if ! git merge-base --is-ancestor HEAD HEAD@{1} 2>/dev/null; then
                      if [ -n "$(git diff --name-only origin/main HEAD)" ]; then
                          git push origin chore/upstream-sync
                          gh pr create \
                            --title "chore: sync upstream VERT main" \
                            --body "Merges upstream VERT main on-demand. Review for conflicts before merging." \
                            --base main \
                            --head chore/upstream-sync || true
                      else
                          echo "No changes from upstream; nothing to PR."
                      fi
                  else
                      echo "Already up to date."
                  fi
